name: Daily Dataset Build

on:
  schedule:
    # Runs at 00:00 UTC every day. You can adjust the cron schedule as needed.
    - cron: '0 0 * * *'
  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # Needed to push changes back to the repository

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Adjust based on your required Python version 
          #please dont change anything in this.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install nbconvert and ipykernel to run the notebook headlessly
          pip install nbconvert ipykernel geopandas matplotlib pandas requests shapely openpyxl google-api-python-client pandas-gbq #here are the dependencies to download 

      # --- ADDED AUTHENTICATION STEP ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}' #its in settings -> security -> actions ->the screte json key is fron google cloud platform iam
      # --------------------------------- 

      - name: Execute Jupyter Notebook
        run: |
          jupyter nbconvert --execute --to notebook --inplace build_cb1_dataset.ipynb #this has the jupiter notebook name 

      - name: Commit executed notebook
        # This step commits the executed notebook back to the repository.
        # It's useful for seeing the output directly in GitHub.
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Executed notebook via GitHub Actions"
          branch: main
          file_pattern: 'build_cb1_dataset.ipynb' # Only commits the specified notebook file
