name: Daily Crash Vehicles Data Pipeline

on:
  schedule:
    # Runs every day at midnight UTC (Adjust as needed)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Change to your required Python version
        cache: 'pip' # Caches dependencies for faster subsequent runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Run Data Pipeline Script
      run: |
        # Replace 'main.py' with the actual entry point script of your project
        python main.py
