name: Daily Crash Vehicles Data Pipeline
- name: Check Secret Presence
      run: |
        if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
          echo "ERROR: GCP_SA_KEY is empty or not found!"
          exit 1
        else
          echo "GCP_SA_KEY is detected successfully."
        fi

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # Removed the cache line that caused the error

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install jupyter and papermill to execute the notebook
        pip install jupyter papermill pandas pandas-gbq google-cloud-bigquery
        # Installs requirements.txt ONLY if you decide to add it later
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Run Jupyter Notebook Pipeline
      run: |
        # Executes the notebook and saves the output to a temporary file
        papermill finalcrashescode.ipynb executed_output.ipynb
