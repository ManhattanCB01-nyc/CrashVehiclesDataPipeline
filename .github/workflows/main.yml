name: Daily Dataset Build

on:
  schedule:
    # Runs at 00:00 UTC every day. You can adjust the cron schedule as needed.
    - cron: '0 0 * * *'
  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # Needed to push changes back to the repository

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Adjust based on your required Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install nbconvert and ipykernel to run the notebook headlessly
          pip install nbconvert ipykernel geopandas matplotlib pandas requests shapely openpyxl google-api-python-client pandas-gbq

      # --- ADDED AUTHENTICATION STEP ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
      # ---------------------------------

      - name: Execute Jupyter Notebook
        run: |
          jupyter nbconvert --execute --to notebook --inplace build_cb1_dataset.ipynb

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 1. Pull the latest code to prevent the "main -> main" rejection
          git pull origin main --rebase
          
          # 2. Add ONLY your data files instead of using "git add ."
          # REPLACE "your_dataset_file.csv" with the actual name of your output file/folder!
          git add your_dataset_file.csv 
          
          # 3. Commit and push
          git commit -m "Automated dataset build" || echo "No changes to commit"
          git push origin main
